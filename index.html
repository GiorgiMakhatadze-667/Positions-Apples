<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="apple">
            <div><img class="imgbig" src="./Apple-Green-removebg.png" alt="green apple"></div>
            <div class="minigreens">
                <div class="mini1"><img class="imgsmall" src="./minimtliani.png" alt="GPfull"></div>
                <div class="mini2"><img class="imgsmall"  src="./minihalf.jpg" alt="GPhalf"></div>
                <div class="mini3"><img class="imgsmall"  src="./minigreen3rd.webp" alt="GP3"></div>
                <div class="mini4"><img class="imgsmall"  src="./minigreen4th.webp" alt="GP4"></div>
            </div>
            <div class="share"><img class="shareimg" src="./SHAREBUTTONpng.png" alt="sharebutton"></div>
            <div class="Heart"><img class="heartimg" src="./HEARTBUTTONGpng.png" alt="heartbutton"></div>
        </div>
        <div class="Text">
            <h1>Delicious Apples</h1>
            <p class="COD">COD:45999</p>
            <p class="price">R$ <b class="b1">7.93</b></p>
            <p class="color">SELECT A COLOR</p>
        </div>
        <div class="bigapples">
            <img class="Apple1" src="./greenappleX.jpg" alt="green">
            <img class="Apple2" src="./Golden-DeliciousNEW.png" alt="yellow">
            <img class="Apple3" src="./red yellow apple.jpg" alt="redyellow">
            <img class="Apple4" src="./red apple.jpg" alt="red">
        </div>
        <div class="benefits">
            <ul><b class="b2">BENEFITS</b>
                <li>Apples are nutricious</li>
                <li>Apples may be good for weight loss</li>
                <li>Apples may be good for bone health</li>
                <li>They're linked to a lowest risk of diabetes</li>
            </ul>
        </div>
        <div class="button"><button><b class="b3">ADD TO CART</b></button></div>
    </div>
</body>
</html>
